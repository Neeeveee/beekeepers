<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>展陈实时曲线</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg: #f5f5f7;
      --text: #000000;
      --muted: #1d1d1f;
      --hairline: #1d1d1f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
    }

    .screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: minmax(178px, 25vh) 1px minmax(0, 1fr);
      gap: clamp(22px, 2.6vw, 42px);
      padding: clamp(34px, 4.2vw, 64px) clamp(42px, 5.2vw, 84px) clamp(30px, 3.4vw, 52px);
      background: var(--bg);
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: start;
    }

    h1 {
      margin: 0;
      font-size: clamp(58px, 5.8vw, 112px);
      line-height: 0.96;
      font-weight: 800;
      letter-spacing: 0;
    }

    .subtitle {
      margin: clamp(18px, 1.8vw, 28px) 0 0;
      max-width: 1120px;
      color: var(--muted);
      font-size: clamp(18px, 1.32vw, 26px);
      font-weight: 750;
      line-height: 1.22;
      letter-spacing: 0;
    }

    .status {
      min-width: 220px;
      display: grid;
      gap: 8px;
      justify-items: end;
      color: var(--text);
      font-size: clamp(16px, 1.18vw, 24px);
      font-weight: 800;
      white-space: nowrap;
      align-self: end;
      padding-bottom: 2px;
    }

    .live {
      color: var(--text);
    }

    .divider {
      width: 100%;
      height: 1px;
      background: var(--hairline);
    }

    .chart-shell {
      min-width: 0;
      min-height: 0;
      position: relative;
      background: transparent;
    }

    #liveChart {
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    .content-grid {
      min-height: 0;
      display: grid;
      grid-template-columns: clamp(190px, 17vw, 280px) minmax(0, 1fr);
      gap: clamp(28px, 4vw, 70px);
      align-items: stretch;
    }

    .metric-row {
      display: flex;
      flex-direction: column;
      gap: clamp(14px, 1.5vw, 24px);
      align-self: start;
    }

    .metric-card {
      width: 100%;
      min-height: clamp(54px, 5.2vw, 82px);
      display: grid;
      place-items: center;
      padding: 0 clamp(20px, 2.2vw, 34px);
      border: 0;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.055);
      color: #1d1d1f;
      text-align: center;
      cursor: pointer;
    }

    .metric-card.is-active {
      background: #fff89a;
      color: #000000;
    }

    .metric-label {
      color: currentColor;
      font-size: clamp(18px, 1.35vw, 26px);
      font-weight: 800;
      line-height: 1.08;
    }

    .metric-value {
      display: none;
      margin-top: 7px;
      color: currentColor;
      font-size: clamp(13px, 0.95vw, 18px);
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 760px) {
      .screen {
        padding: 28px 24px 30px;
        gap: 24px;
      }

      .topbar {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: clamp(42px, 12vw, 72px);
      }

      .status {
        justify-items: start;
        align-self: start;
      }

      .metric-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .content-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .metric-card {
        min-height: 48px;
        padding: 0 10px;
      }

      .metric-label {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="screen">
    <header class="topbar">
      <div>
        <h1 id="screenTitle">生态时间序列</h1>
        <p class="subtitle" id="screenSubtitle">开花状态基于历史实际数据按分钟动态更新，当前窗口180分钟</p>
      </div>
      <div class="status">
        <div class="live">实时更新中</div>
        <div id="clockText">--:--</div>
      </div>
    </header>

    <div class="divider" aria-hidden="true"></div>

    <section class="content-grid">
      <section class="metric-row" aria-label="当前指标">
        <button class="metric-card" type="button" data-metric-card="flowering">
          <div>
            <div class="metric-label">开花状态</div>
            <div class="metric-value" id="floweringValue">--%</div>
          </div>
        </button>
        <button class="metric-card" type="button" data-metric-card="nectar">
          <div>
            <div class="metric-label">蜜源供给强度</div>
            <div class="metric-value" id="nectarValue">--%</div>
          </div>
        </button>
        <button class="metric-card" type="button" data-metric-card="mismatch">
          <div>
            <div class="metric-label">错配风险</div>
            <div class="metric-value" id="mismatchValue">--%</div>
          </div>
        </button>
      </section>

      <section class="chart-shell" aria-label="实时曲线">
        <div id="liveChart"></div>
      </section>
    </section>
  </main>

  <script src="./js/exhibition-realtime-curve.js?v=20260524v4"></script>
</body>
</html>
