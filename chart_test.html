<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>曲线测试页</title>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const panel = params.get("panel");
            const embed = params.get("embed");
            if (panel === "flower" || panel === "bee") {
                document.documentElement.dataset.panelMode = panel;
            }
            if (embed === "1") {
                document.documentElement.dataset.embedMode = "1";
            }
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #f7f7f7;
            color: #292e38;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .chart-block {
            width: min(calc(100vw - 48px), 1160px);
            margin: 0 auto;
            padding: 24px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 0;
            border-radius: 6px;
        }

        .chart-block h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            line-height: 1.2;
            color: #292e38;
        }

        .title-row {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 16px;
            flex-wrap: wrap;
        }

        .traceability-wrap {
            position: relative;
        }

        .traceability-button {
            height: 28px;
            padding: 0 12px;
            border: 1px solid rgba(117, 128, 148, 0.28);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.72);
            color: #4f596b;
            font-size: 12px;
            font-weight: 600;
            line-height: 1;
            cursor: pointer;
        }

        .traceability-button:hover,
        .traceability-button[aria-expanded="true"] {
            background: rgba(246, 226, 0, 0.2);
            border-color: rgba(246, 226, 0, 0.6);
            color: #292e38;
        }

        .traceability-panel {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            z-index: 10;
            width: min(360px, calc(100vw - 80px));
            padding: 14px 16px;
            box-sizing: border-box;
            border: 1px solid rgba(219, 224, 232, 0.95);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 10px 30px rgba(31, 35, 43, 0.12);
        }

        .traceability-panel[hidden] {
            display: none;
        }

        .traceability-panel-title {
            margin: 0 0 10px;
            color: #1f232b;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.4;
        }

        .traceability-item + .traceability-item {
            margin-top: 8px;
        }

        .traceability-label {
            display: block;
            margin-bottom: 2px;
            color: #4f596b;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.4;
        }

        .traceability-value {
            margin: 0;
            color: #5d6779;
            font-size: 12px;
            line-height: 1.6;
        }

        .eco-layout,
        .bee-layout {
            display: grid;
            grid-template-columns: 132px minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        .eco-side-controls,
        .bee-side-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 332px;
        }

        .eco-side-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 332px;
        }

        .eco-side-column .eco-side-controls {
            min-height: auto;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 0;
        }

        .button-group button {
            width: 128px;
            min-height: 36px;
            padding: 8px 12px;
            box-sizing: border-box;
            border: none;
            border-radius: 36px;
            background: rgba(237, 237, 237, 0.5);
            color: #292e38;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
            cursor: pointer;
        }

        .button-group button.active {
            background: rgba(255, 246, 0, 0.5);
            font-weight: 600;
        }

        .chart-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }

        .curve-legend {
            display: flex;
            align-items: center;
            gap: 18px;
            min-height: 18px;
            padding-left: 4px;
        }

        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #758094;
            font-size: 13px;
            font-weight: 500;
            line-height: 1;
            white-space: nowrap;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex: 0 0 auto;
        }

        .legend-dot.history {
            background: #bfbfbf;
        }

        .legend-dot.forecast {
            background: #f6e200;
        }

        .chart-plot-frame {
            width: 100%;
            height: 286px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 6px;
            overflow: hidden;
        }

        .chart {
            width: 100%;
            height: 286px;
        }

        .hint-box {
            display: none !important;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .dominant-plant-card {
            width: 200px;
            min-height: 88px;
            box-sizing: border-box;
            padding: 0 0 0 8px;
            background: transparent;
            border: 0;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .dominant-plant-title {
            margin: 0;
            color: #3a3f48;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.35;
        }

        .dominant-plant-row {
            margin-top: 16px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: #1f232b;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.2;
        }

        .dominant-plant-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #f6e200;
            flex: 0 0 auto;
        }

        .dominant-plant-name {
            white-space: nowrap;
        }

        .dominant-plant-empty {
            margin-top: 28px;
            color: #758094;
            font-size: 15px;
            font-weight: 500;
        }

        html[data-panel-mode] .chart-block {
            display: none;
        }

        html[data-panel-mode="bee"] #beeCurveBlock,
        html[data-panel-mode="flower"] #flowerCurveBlock {
            display: block;
        }

        html[data-panel-mode][data-embed-mode="1"] body {
            padding: 0;
            background: transparent;
            overflow: hidden;
        }

        html[data-panel-mode][data-embed-mode="1"] .chart-block {
            width: 100%;
            margin: 0;
            padding: 24px;
        }

        html[data-panel-mode][data-embed-mode="1"] .chart,
        html[data-panel-mode][data-embed-mode="1"] .chart-plot-frame {
            height: 286px;
        }

        @media (max-width: 960px) {
            body {
                padding: 16px;
                overflow: auto;
            }

            .chart-block {
                padding: 20px;
            }

            .eco-layout,
            .bee-layout {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .eco-side-controls,
            .bee-side-controls {
                min-height: auto;
            }

            .eco-side-column {
                gap: 20px;
                min-height: auto;
            }

            .button-group {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .dominant-plant-card {
                width: 100%;
                min-width: 0;
            }
        }
    </style>
</head>

<body>
    <div id="beeCurveBlock" class="chart-block" data-panel="bee">
        <h2>蜜蜂活跃度曲线（历史实测 + 未来预测）</h2>
        <div class="bee-layout">
            <div class="bee-side-controls">
                <div class="button-group">
                    <button id="btn-bee-hour" class="active" onclick="setBeeTimeScale('hour')">按小时</button>
                    <button id="btn-bee-day" onclick="setBeeTimeScale('day')">按天</button>
                    <button id="btn-bee-day-mean" style="display: none;" onclick="setBeeDailyMetric('mean')">日均值</button>
                    <button id="btn-bee-day-peak" style="display: none;" onclick="setBeeDailyMetric('peak')">日峰值</button>
                </div>
            </div>
            <div class="chart-area">
                <div class="curve-legend">
                    <span class="legend-item"><span class="legend-dot history"></span>历史曲线</span>
                    <span class="legend-item"><span class="legend-dot forecast"></span>未来曲线</span>
                </div>
                <div class="chart-plot-frame">
                    <div id="beeChart" class="chart"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="flowerCurveBlock" class="chart-block" data-panel="flower">
        <h2>生态时间序列</h2>
        <div class="eco-layout">
            <div class="eco-side-column">
                <div class="eco-side-controls">
                    <div class="button-group">
                        <button id="btn-flowering_overview" class="active" onclick="setEcoMetric('flowering_overview')">开花状态</button>
                        <button id="btn-nectar_supply_overview" onclick="setEcoMetric('nectar_supply_overview')">蜜源供给强度</button>
                        <button id="btn-mismatch_overview" onclick="setEcoMetric('mismatch_overview')">错配风险</button>
                    </div>
                </div>
                <div id="floweringSidePanel" class="side-panel" style="display: none;">
                    <div id="currentDominantPlant" class="dominant-plant-card"></div>
                    <div id="futureDominantPlant" class="dominant-plant-card"></div>
                </div>
            </div>
            <div class="chart-area">
                <div class="curve-legend">
                    <span class="legend-item"><span class="legend-dot history"></span>历史曲线</span>
                    <span class="legend-item"><span class="legend-dot forecast"></span>未来曲线</span>
                </div>
                <div class="chart-plot-frame">
                    <div id="ecoChart" class="chart"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="./chart_page.js?v=20260406v15"></script>
</body>

</html>
