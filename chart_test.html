<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>曲线测试页</title>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const panel = params.get("panel");
            const embed = params.get("embed");
            if (panel === "flower" || panel === "bee") {
                document.documentElement.dataset.panelMode = panel;
            }
            if (embed === "1") {
                document.documentElement.dataset.embedMode = "1";
            }
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #f7f7f7;
            color: #292e38;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .chart-block {
            width: min(calc(100vw - 48px), 1160px);
            margin: 0 auto;
            padding: 24px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 0;
            border-radius: 16px;
        }

        .chart-block h2 {
            margin: 0 0 16px;
            font-size: 20px;
            font-weight: 600;
            line-height: 1.2;
            color: #292e38;
        }

        .eco-layout,
        .bee-layout {
            display: grid;
            grid-template-columns: 132px minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        .eco-side-controls,
        .bee-side-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 332px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 0;
        }

        .button-group button {
            width: 128px;
            min-height: 36px;
            padding: 8px 12px;
            box-sizing: border-box;
            border: none;
            border-radius: 36px;
            background: rgba(237, 237, 237, 0.5);
            color: #292e38;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
            cursor: pointer;
        }

        .button-group button.active {
            background: rgba(255, 246, 0, 0.5);
            font-weight: 600;
        }

        .chart-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }

        .curve-legend {
            display: flex;
            align-items: center;
            gap: 18px;
            min-height: 18px;
            padding-left: 4px;
        }

        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #758094;
            font-size: 13px;
            font-weight: 500;
            line-height: 1;
            white-space: nowrap;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex: 0 0 auto;
        }

        .legend-dot.history {
            background: #bfbfbf;
        }

        .legend-dot.forecast {
            background: #f6e200;
        }

        .chart-plot-frame {
            width: 100%;
            height: 286px;
            box-sizing: border-box;
            background: rgba(251, 252, 255, 0.58);
            border: 1px solid rgba(219, 224, 232, 0.62);
            border-radius: 12px;
            overflow: hidden;
        }

        .chart {
            width: 100%;
            height: 286px;
        }

        .hint-box {
            display: none !important;
        }

        .eco-flex {
            display: none;
            width: 200px;
            min-width: 200px;
            align-self: stretch;
        }

        .eco-layout.show-side-panel {
            grid-template-columns: 132px minmax(0, 1fr) 200px;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .mini-chart {
            width: 200px;
            height: 156px;
            box-sizing: border-box;
            background: rgba(251, 252, 255, 0.58);
            border: 1px solid rgba(219, 224, 232, 0.62);
            border-radius: 12px;
        }

        html[data-panel-mode] .chart-block {
            display: none;
        }

        html[data-panel-mode="bee"] #beeCurveBlock,
        html[data-panel-mode="flower"] #flowerCurveBlock {
            display: block;
        }

        html[data-panel-mode][data-embed-mode="1"] body {
            padding: 0;
            background: transparent;
            overflow: hidden;
        }

        html[data-panel-mode][data-embed-mode="1"] .chart-block {
            width: 100%;
            margin: 0;
            padding: 24px;
        }

        html[data-panel-mode][data-embed-mode="1"] .chart,
        html[data-panel-mode][data-embed-mode="1"] .chart-plot-frame {
            height: 286px;
        }

        @media (max-width: 960px) {
            body {
                padding: 16px;
                overflow: auto;
            }

            .chart-block {
                padding: 20px;
            }

            .eco-layout,
            .bee-layout {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .eco-layout.show-side-panel {
                grid-template-columns: 1fr;
            }

            .eco-side-controls,
            .bee-side-controls {
                min-height: auto;
            }

            .button-group {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .eco-flex,
            .mini-chart {
                width: 100%;
                min-width: 0;
            }
        }
    </style>
</head>

<body>
    <div id="beeCurveBlock" class="chart-block" data-panel="bee">
        <h2>蜜蜂活跃度曲线（历史实测 + 未来预测）</h2>
        <div class="bee-layout">
            <div class="bee-side-controls">
                <div class="button-group">
                    <button id="btn-bee-hour" class="active" onclick="setBeeTimeScale('hour')">按小时</button>
                    <button id="btn-bee-day" onclick="setBeeTimeScale('day')">按天</button>
                    <button id="btn-bee-day-mean" style="display: none;" onclick="setBeeDailyMetric('mean')">日均值</button>
                    <button id="btn-bee-day-peak" style="display: none;" onclick="setBeeDailyMetric('peak')">日峰值</button>
                </div>
            </div>
            <div class="chart-area">
                <div class="curve-legend">
                    <span class="legend-item"><span class="legend-dot history"></span>历史曲线</span>
                    <span class="legend-item"><span class="legend-dot forecast"></span>未来曲线</span>
                </div>
                <div class="chart-plot-frame">
                    <div id="beeChart" class="chart"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="flowerCurveBlock" class="chart-block" data-panel="flower">
        <h2>生态时间序列</h2>
        <div class="eco-layout">
            <div class="eco-side-controls">
                <div class="button-group">
                    <button id="btn-flowering_overview" class="active" onclick="setEcoMetric('flowering_overview')">开花状态</button>
                    <button id="btn-nectar_supply_overview" onclick="setEcoMetric('nectar_supply_overview')">蜜源供给强度</button>
                    <button id="btn-mismatch_overview" onclick="setEcoMetric('mismatch_overview')">错配风险</button>
                </div>
            </div>
            <div class="chart-area">
                <div class="curve-legend">
                    <span class="legend-item"><span class="legend-dot history"></span>历史曲线</span>
                    <span class="legend-item"><span class="legend-dot forecast"></span>未来曲线</span>
                </div>
                <div class="chart-plot-frame">
                    <div id="ecoChart" class="chart"></div>
                </div>
            </div>
            <div class="eco-flex">
                <div>
                    <div id="floweringHint" class="hint-box" style="display: none;"></div>
                    <div id="nectarHint" class="hint-box" style="display: none;"></div>
                    <div id="mismatchHint" class="hint-box" style="display: none;"></div>
                </div>
                <div id="floweringSidePanel" class="side-panel" style="display: none;">
                    <div id="currentPie" class="mini-chart"></div>
                    <div id="futurePie" class="mini-chart"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="./chart_page.js?v=20260331v8"></script>
</body>

</html>
