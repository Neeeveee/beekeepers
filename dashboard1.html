<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bee Dashboard</title>
  <style>
    :root {
      --page-bg: #ffffff;
      --surface-soft: rgba(255, 255, 255, 0.4);
      --surface-softer: rgba(255, 255, 255, 0.08);
      --line-main: #b0b0b0;
      --line-soft: #d7d7d7;
      --line-top: #e7e7e7;
      --text-main: #2c2c2c;
      --text-subtle: #3e3e3e;
      --text-soft: #6c6c6c;
      --text-muted: #c4c9d4;
      --highlight: rgba(255, 246, 0, 0.4);
      --overlay: rgba(0, 0, 0, 0.4);
      --radius-sm: 6px;
      --radius-pill: 20px;
      --gap: 20px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page-bg);
      color: var(--text-main);
    }

    body {
      width: 100vw;
      height: 100vh;
    }

    button {
      font: inherit;
    }

    .app-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--page-bg);
    }

    .map-module-container {
      position: absolute;
      inset: 0;
      border-radius: 8px;
      background: #ffffff;
      overflow: hidden;
    }

    .map-module-label {
      position: absolute;
      top: 293px;
      left: 295.5px;
      font-size: 18px;
      color: var(--text-main);
      white-space: nowrap;
    }

    .map-module-container.heatmap-active::after {
      content: "heatmap-layer-placeholder";
      position: absolute;
      left: 32px;
      bottom: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      height: 38px;
      padding: 0 14px;
      border: 0.6px dashed rgba(188, 188, 188, 0.9);
      border-radius: var(--radius-sm);
      background: rgba(255, 246, 0, 0.12);
      color: #8a7a00;
      font-size: 13px;
      pointer-events: none;
    }

    .flower-layer-container,
    .bee-layer-container {
      position: absolute;
      top: 20px;
      left: 197px;
      width: 220px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-sm);
      background: var(--overlay);
      color: var(--text-muted);
      font-size: 14px;
      z-index: 2;
    }

    .bee-layer-container {
      top: 88px;
      left: 120px;
    }

    .layer-hidden {
      display: none;
    }

    .top-right-info-bar {
      position: absolute;
      top: 32px;
      right: 22px;
      width: 520px;
      height: 30px;
      border: 0.6px solid var(--line-top);
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(4px);
      overflow: hidden;
      z-index: 3;
    }

    .top-right-info-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 520px;
      height: 3px;
      object-fit: cover;
      pointer-events: none;
    }

    .info-chip-list {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 87px 86px 87px 87px 86px 87px;
      align-items: start;
      padding-top: 2.4px;
    }

    .info-chip {
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-sm);
      background: var(--surface-softer);
      color: var(--text-subtle);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .left-navigation {
      position: absolute;
      top: 20px;
      left: 17px;
      width: 225px;
      height: 312px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(4px);
      z-index: 3;
    }

    .left-navigation::before,
    .left-navigation::after {
      content: "";
      position: absolute;
      left: 18px;
      width: 189px;
      height: 3px;
      background-repeat: no-repeat;
      background-size: 189px 3px;
      pointer-events: none;
    }

    .left-navigation::before {
      top: 24px;
      background-image: url("./images/image 28.png");
    }

    .left-navigation::after {
      top: 285px;
      background-image: url("./images/image 27.png");
    }

    .brand-mark {
      position: absolute;
      top: 30px;
      left: 18px;
      width: 120px;
      height: 105px;
      object-fit: contain;
      object-position: left top;
      pointer-events: none;
    }

    .mode-switch {
      position: absolute;
      inset: 0;
    }

    .mode-button {
      position: absolute;
      left: 18px;
      width: 165px;
      height: 45px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding-left: 18px;
      border: 0;
      border-top: 0.4px solid var(--line-main);
      background: var(--surface-softer);
      color: var(--text-soft);
      text-align: left;
      cursor: pointer;
    }

    .mode-button.active {
      background: linear-gradient(90deg, rgba(255, 246, 0, 0.29) 50%, rgba(255, 246, 0, 0) 100%);
    }

    .overlay-hidden {
      display: none;
    }

    .mode-button.mode-flower {
      top: 150px;
    }

    .mode-button.mode-bee {
      top: 195px;
    }

    .mode-button.mode-plan {
      top: 240px;
    }

    .mode-icon {
      width: 30px;
      height: 30px;
      object-fit: cover;
      flex: 0 0 auto;
      pointer-events: none;
    }

    .mode-label {
      font-size: 21px;
      line-height: 1;
      white-space: nowrap;
    }

    .bottom-left-layer-toggle {
      position: absolute;
      left: 23px;
      bottom: 20px;
      width: 118px;
      height: 50px;
      border: 1px solid #afafaf;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(4px);
      z-index: 3;
    }

    .toggle-button {
      position: absolute;
      top: 4px;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0.6px solid #bbbbbb;
      border-radius: 20px;
      background: transparent;
      cursor: pointer;
    }

    .toggle-button.active {
      background: var(--highlight);
    }

    .toggle-button.heatmap-toggle {
      left: 13px;
    }

    .toggle-button.curve-toggle {
      left: 63px;
    }

    .toggle-icon {
      width: 24px;
      height: 24px;
      object-fit: cover;
      pointer-events: none;
    }

    .toggle-icon.curve {
      width: 24px;
      height: 24px;
      object-position: center;
    }

    .right-information {
      position: absolute;
      right: 20px;
      bottom: 20px;
      width: 420px;
      height: 320px;
      border: 0;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(4px);
      z-index: 3;
      transition: transform 0.2s ease;
    }

    .app-shell.curve-panel-open .right-information {
      transform: translateY(-132px);
    }

    .dashboard-panel-title {
      position: absolute;
      top: 12px;
      left: 14px;
      width: 392px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      font-size: 14px;
    }

    .dashboard-grid {
      position: absolute;
      left: 18px;
      top: 54px;
      display: grid;
      grid-template-columns: repeat(2, 185px);
      grid-template-rows: repeat(2, 122px);
      gap: 14px;
    }

    .dashboard-gauge-slot {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 185px;
      height: 122px;
      border: 1px solid var(--line-soft);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-size: 13px;
    }

    .bottom-curve-panel {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 20px;
      height: 112px;
      padding: 12px 16px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(16px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 1;
    }

    .bottom-curve-panel.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .curve-module-mount {
      width: 100%;
      height: 100%;
      position: relative;
      border: 1px dashed rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .curve-module-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
    }

    .curve-module-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
    }

    .curve-module-hint.is-hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <div class="map-module-container">
      <div class="map-module-label">map-module-container</div>
    </div>

    <div class="flower-layer-container overlay-hidden">flower-layer-container</div>
    <div class="bee-layer-container layer-hidden">bee-layer-container</div>

    <header class="top-right-info-bar" aria-label="右上信息条">
      <img class="top-right-info-line" src="./images/image 29.png" alt="" aria-hidden="true" />
      <div class="info-chip-list">
        <div class="info-chip">地点</div>
        <div class="info-chip">日期</div>
        <div class="info-chip">时间</div>
        <div class="info-chip">天气</div>
        <div class="info-chip">温度</div>
        <div class="info-chip">湿度</div>
      </div>
    </header>

    <aside class="left-navigation" aria-label="左侧导航">
      <img class="brand-mark" src="./images/image 21.png" alt="B-Cue 标识" />
      <nav class="mode-switch" aria-label="模式切换">
        <button class="mode-button mode-flower" type="button" data-toggle-group="mode-switch" data-layer-target="flower">
          <img class="mode-icon" src="./images/image 26.png" alt="" aria-hidden="true" />
          <span class="mode-label">环境</span>
        </button>
        <button class="mode-button mode-bee" type="button" data-toggle-group="mode-switch" data-layer-target="bee">
          <img class="mode-icon" src="./images/image 25.png" alt="" aria-hidden="true" />
          <span class="mode-label">行为</span>
        </button>
        <button class="mode-button mode-plan" type="button" data-toggle-group="mode-switch">
          <img class="mode-icon" src="./images/image 24.png" alt="" aria-hidden="true" />
          <span class="mode-label">策略</span>
        </button>
      </nav>
    </aside>

    <section class="bottom-left-layer-toggle" aria-label="左下控制区">
      <button class="toggle-button heatmap-toggle" type="button" data-toggle-mode="independent" data-panel-target="heatmap" aria-label="热力图开关">
        <img class="toggle-icon" src="./images/image 22.png" alt="" aria-hidden="true" />
      </button>
      <button class="toggle-button curve-toggle" type="button" data-toggle-mode="independent" data-panel-target="curve" aria-label="曲线图开关">
        <img class="toggle-icon curve" src="./images/image 23.png" alt="" aria-hidden="true" />
      </button>
    </section>

    <aside class="right-information" aria-label="右侧信息区">
      <div class="dashboard-panel-title">bottom-right-dashboard-panel</div>
      <div class="dashboard-grid">
        <div class="dashboard-gauge-slot">gauge-slot-1</div>
        <div class="dashboard-gauge-slot">gauge-slot-2</div>
        <div class="dashboard-gauge-slot">gauge-slot-3</div>
        <div class="dashboard-gauge-slot">gauge-slot-4</div>
      </div>
    </aside>

    <section class="bottom-curve-panel" aria-label="底部曲线面板">
      <div class="curve-module-mount">
        <iframe
          id="curveModuleFrame"
          class="curve-module-frame"
          title="底部曲线模块"
          loading="lazy"
        ></iframe>
        <div id="curveModuleHint" class="curve-module-hint">
          请选择“环境”或“行为”模式以加载对应曲线模块
        </div>
      </div>
    </section>
  </main>

  <script>
    // GitHub-hosted chart page with auto-updated data. Keep this as the only source entry.
    const CURVE_MODULE_BASE_URL = "https://neeeveee.github.io/beekeepers/chart_test.html?mode=static&t=20260323v2";

    const appShell = document.querySelector(".app-shell");
    const modeButtons = document.querySelectorAll(".mode-button[data-toggle-group='mode-switch']");
    const independentButtons = document.querySelectorAll(".toggle-button[data-toggle-mode='independent']");
    const curvePanel = document.querySelector(".bottom-curve-panel");
    const flowerLayer = document.querySelector(".flower-layer-container");
    const beeLayer = document.querySelector(".bee-layer-container");
    const mapModuleContainer = document.querySelector(".map-module-container");
    const curveModuleFrame = document.getElementById("curveModuleFrame");
    const curveModuleHint = document.getElementById("curveModuleHint");

    function setLayerVisibility(showFlower) {
      flowerLayer.classList.remove("overlay-hidden");
      flowerLayer.classList.toggle("layer-hidden", !showFlower);
      beeLayer.classList.toggle("layer-hidden", showFlower);
    }

    function clearLayerVisibility() {
      flowerLayer.classList.add("overlay-hidden");
      flowerLayer.classList.add("layer-hidden");
      beeLayer.classList.add("layer-hidden");
    }

    function getCurrentCurveMode() {
      const activeModeButton = document.querySelector(".mode-button.active[data-layer-target]");
      return activeModeButton ? activeModeButton.dataset.layerTarget : null;
    }

    function buildCurveModuleUrl() {
      const currentMode = getCurrentCurveMode();
      if (currentMode !== "flower" && currentMode !== "bee") {
        return "";
      }
      return `${CURVE_MODULE_BASE_URL}&panel=${currentMode}`;
    }

    function applyCurveModuleView() {
      const currentMode = getCurrentCurveMode();
      const nextUrl = buildCurveModuleUrl();
      const shouldShowFrame = currentMode === "flower" || currentMode === "bee";

      curveModuleHint.classList.toggle("is-hidden", shouldShowFrame);
      curveModuleFrame.style.visibility = shouldShowFrame ? "visible" : "hidden";

      if (!shouldShowFrame) {
        curveModuleFrame.removeAttribute("src");
        return;
      }

      if (curveModuleFrame.dataset.currentSrc !== nextUrl) {
        curveModuleFrame.src = nextUrl;
        curveModuleFrame.dataset.currentSrc = nextUrl;
      }
    }

    modeButtons.forEach(button => {
      button.addEventListener("click", () => {
        const isAlreadyActive = button.classList.contains("active");

        modeButtons.forEach(item => item.classList.remove("active"));

        if (isAlreadyActive) {
          clearLayerVisibility();
          applyCurveModuleView();
          return;
        }

        button.classList.add("active");

        if (button.dataset.layerTarget === "flower") {
          setLayerVisibility(true);
          applyCurveModuleView();
          return;
        }

        if (button.dataset.layerTarget === "bee") {
          setLayerVisibility(false);
          applyCurveModuleView();
          return;
        }

        clearLayerVisibility();
        applyCurveModuleView();
      });
    });

    independentButtons.forEach(button => {
      button.addEventListener("click", () => {
        button.classList.toggle("active");

        if (button.dataset.panelTarget === "heatmap") {
          const shouldShowHeatmap = button.classList.contains("active");
          mapModuleContainer.classList.toggle("heatmap-active", shouldShowHeatmap);
        }

        if (button.dataset.panelTarget === "curve") {
          const shouldShowCurve = button.classList.contains("active");
          curvePanel.classList.toggle("is-visible", shouldShowCurve);
          appShell.classList.toggle("curve-panel-open", shouldShowCurve);

          if (shouldShowCurve) {
            applyCurveModuleView();
            return;
          }

          curveModuleFrame.removeAttribute("src");
          curveModuleFrame.dataset.currentSrc = "";
          curveModuleHint.classList.remove("is-hidden");
        }
      });
    });
  </script>
</body>
</html>
