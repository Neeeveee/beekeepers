      "朱家角景游复合区": "冬青",

    const FLOWER_COLOR_MAP = {
      "冬青": "#f3ea2a",
      "果梅": "#c557a1",
      "梅": "#c557a1",
      "苦槠": "#a8c9d7",
      "柃木": "#f09a95",
      "栾树": "#a9d07a",
      "枇杷": "#f39c12",
      "五倍子": "#c9ab3a",
      "油菜": "#82d8c4"
    };

    const bounds = L.latLngBounds(
      [CONFIG.BOUNDS.south, CONFIG.BOUNDS.west],
      [CONFIG.BOUNDS.north, CONFIG.BOUNDS.east]
    );

    const map = L.map('map', {
      zoomControl: false,
      maxZoom: CONFIG.TILE_MAX_ZOOM,
      maxBounds: bounds,
      maxBoundsViscosity: 1.0,
      zoomSnap: 0.1,
      zoomDelta: 0.25,
      wheelDebounceTime: 20,
      wheelPxPerZoomLevel: 120,
      preferCanvas: true,
      attributionControl: false,
      inertia: false,
      fadeAnimation: true,
      zoomAnimation: true,
      markerZoomAnimation: true
    });

    map.createPane('maskPane');
    map.getPane('maskPane').style.zIndex = 350;
    map.getPane('maskPane').style.pointerEvents = 'none';

    const baseLayer = L.tileLayer(CONFIG.QGIS_TILE_URL, {
      maxZoom: CONFIG.TILE_MAX_ZOOM,
      maxNativeZoom: CONFIG.TILE_MAX_ZOOM,
      minNativeZoom: CONFIG.TILE_MIN_ZOOM,
      noWrap: true,
            opacity: 1,
      updateWhenIdle: false,
      updateWhenZooming: true,
      keepBuffer: 2
    });
    baseLayer.addTo(map);

    // Invisible zone layer: only for click lookup, not displayed
    const zoneLayer = L.geoJSON(ZONE_DATA, {
      style: () => ({
        stroke: false,
        weight: 0,
        opacity: 0,
        fillOpacity: 0,
        interactive: false
      })
    }).addTo(map);

    function applyInitialView(forceFit = false) {
      const exactFitZoom = Math.min(
        CONFIG.TILE_MAX_ZOOM,
        map.getBoundsZoom(bounds, false, L.point(0, 0))
      );

      map.setMinZoom(exactFitZoom);
      map.setMaxBounds(bounds);

      if (forceFit) {
        map.fitBounds(bounds, {
          padding: [0, 0],
          animate: false,
          maxZoom: exactFitZoom
        });
      } else {
        const current = map.getZoom();
        if (current < exactFitZoom) {
          map.setZoom(exactFitZoom, { animate: false });
        }
        map.panInsideBounds(bounds, { animate: false });
      }
    }

    function addOutsideMask() {
      const worldNorth = 85;
      const worldSouth = -85;
      const worldWest = -180;
      const worldEast = 180;
      const fill = {
        pane: 'maskPane',
        stroke: false,
        fillColor: '#ffffff',
        fillOpacity: CONFIG.MASK_FILL_OPACITY,
        interactive: false
      };

      L.rectangle([[worldSouth, worldWest], [worldNorth, CONFIG.BOUNDS.west]], fill).addTo(map);
      L.rectangle([[worldSouth, CONFIG.BOUNDS.east], [worldNorth, worldEast]], fill).addTo(map);
      L.rectangle([[CONFIG.BOUNDS.north, CONFIG.BOUNDS.west], [worldNorth, CONFIG.BOUNDS.east]], fill).addTo(map);
      L.rectangle([[worldSouth, CONFIG.BOUNDS.west], [CONFIG.BOUNDS.south, CONFIG.BOUNDS.east]], fill).addTo(map);

    }

    function clampLatLng(latlng) {
      const lat = Math.min(CONFIG.BOUNDS.north, Math.max(CONFIG.BOUNDS.south, latlng.lat));
      const lng = Math.min(CONFIG.BOUNDS.east, Math.max(CONFIG.BOUNDS.west, latlng.lng));
      return L.latLng(lat, lng);
    }

    function findZoneName(lat, lng) {
      const pt = turf.point([lng, lat]);
      for (const feature of ZONE_DATA.features) {
        try {
          if (turf.booleanPointInPolygon(pt, feature)) {
            return feature.properties?.label_web || '未命名分区';
          }
        } catch (err) {
          // ignore invalid feature and continue
        }
      }
      return '未命名分区';
    }

    function getDominantFlower(placeName) {
      return FLOWER_MAP[placeName] || '未指定';
    }

    function renderFlowerTags(dominantFlower) {
      return dominantFlower
        .split('、')
        .map(name => name.trim())
        .filter(Boolean)
        .map(name => {
          const color = FLOWER_COLOR_MAP[name] || '#cccccc';
          return `
            <span class="flower-tag">
              <span class="flower-swatch" style="background:${color}"></span>
              <span class="flower-name">${name}</span>
            </span>
          `;
        })
        .join('');
    }

    function popupHtml(placeName, dominantFlower) {
      return `
        <div class="mini-popup-card">
          <div class="mini-popup-title">${placeName}</div>
          <div class="mini-popup-row mini-popup-row-top">
            <span>主导花源</span>
            <strong class="flower-tags">${renderFlowerTags(dominantFlower)}</strong>
          </div>
        </div>
      `;
    }

    let activePopup = null;

    function handleClick(latlng) {
      const p = clampLatLng(latlng);
      const zoneName = findZoneName(p.lat, p.lng);
      const dominantFlower = getDominantFlower(zoneName);

      if (activePopup) map.closePopup(activePopup);
      activePopup = L.popup({
        closeButton: false,
        autoPan: false,
        offset: [12, -10],
        className: 'mini-popup'
      })
        .setLatLng(p)
        .setContent(popupHtml(zoneName, dominantFlower))
        .openOn(map);
    }

    addOutsideMask();
    applyInitialView(true);
    window.addEventListener('resize', () => applyInitialView(false));
    map.on('zoomend', () => applyInitialView(false));
    map.on('click', (e) => handleClick(e.latlng));
  </script>
